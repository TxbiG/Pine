
name: Compiler Regression Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  regression:
    name: Compiler tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            pine: build/Release/pine.exe
          - os: ubuntu-latest
            pine: build/pine
          - os: macos-latest
            pine: build/pine

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pycparser

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Check simple example
        run: '"${{ matrix.pine }}" check examples/simple.pine'
        shell: bash

      - name: Check IR generation
        run: '"${{ matrix.pine }}" ir examples/simple.pine'
        shell: bash

      - name: Check native flow example
        run: '"${{ matrix.pine }}" native examples/native_flow.pine --target x86_64'
        shell: bash

      - name: Check native calls example
        run: '"${{ matrix.pine }}" native examples/native_calls.pine --target x86_64'
        shell: bash

      - name: Check native layout example
        run: '"${{ matrix.pine }}" native examples/native_layout.pine --target x86_64'
        shell: bash

      - name: Run CTest
        run: ctest --test-dir build -C Release --output-on-failure
