
Build · YML
name: Build
 
on:
  push:
  pull_request:
  workflow_dispatch:
 
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
 
      - name: Install Python test dependencies
        run: python -m pip install pycparser
 
      - name: Configure
        run: cmake -S . -B build
 
      - name: Build
        run: cmake --build build --config Release
 
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
 
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
