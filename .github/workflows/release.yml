
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: pine-windows-x64
            executable: build/Release/pine.exe
            asset: pine-windows-x64.exe

          - os: ubuntu-latest
            artifact: pine-linux-x64
            executable: build/pine
            asset: pine-linux-x64

          - os: macos-latest
            artifact: pine-macos
            executable: build/pine
            asset: pine-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pycparser

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.executable }}" "dist/${{ matrix.asset }}"

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
